build_settings:
  build_image: dockerfile
  dockerfile_path: Dockerfile
  container_port: 8000
  environment_variables:
    - name: ALLOWED_HOSTS
      from_domains: true
    - name: CSRF_TRUSTED_ORIGINS
      source: manual
    - name: DJANGO_SECRET_KEY
      source: manual
    - name: HUBAI_EVENT_CODE
      source: manual
    - name: DATABASE_URL
      from_database:
        name: db
        property: private_connection_url
    - name: DJANGO_DEBUG
      value: "0"
    - name: WEB_CONCURRENCY
      value: "2"

databases:
  db:
    type: postgresql_17

services:
  web:
    command: sh run.sh
  release:
    command: sh release.sh
