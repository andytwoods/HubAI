{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HubAI{% endblock title %}</title>
  <link rel="stylesheet" href="{% static 'css/bulma.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/project.css' %}">
  <script src="{% static 'js/htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <nav class="navbar is-dark" aria-label="main navigation">
    <div class="navbar-brand">
      <a class="navbar-item has-text-weight-bold" href="{% url 'projects:home' %}">HubAI</a>
    </div>
    {% if user.is_authenticated %}
      <div class="navbar-end is-flex is-align-items-center px-3">
        <span class="mr-3">{{ user.display_name }}</span>
        <form method="post" action="{% url 'users:logout' %}">{% csrf_token %}
          <button class="button is-small is-light" type="submit">Sign out</button>
        </form>
      </div>
    {% endif %}
  </nav>
  <main class="section">
    <div class="container">
      {% for message in messages %}
        <div class="notification is-{% if message.tags == 'error' %}danger{% else %}info{% endif %} is-light">{{ message }}</div>
      {% endfor %}
      {% block main %}{% block content %}{% endblock content %}{% endblock main %}
    </div>
  </main>
</body>
</html>
