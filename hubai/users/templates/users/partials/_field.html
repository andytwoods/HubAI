<div class="field">
  <label class="label" for="{{ field.id_for_label }}">{{ field.label }}</label>
  <div class="control">
    <input class="input{% if field.errors %} is-danger{% endif %}" type="{{ field.field.widget.input_type }}"
           name="{{ field.html_name }}" id="{{ field.id_for_label }}" value="{{ field.value|default_if_none:'' }}"
           {% if field.field.required %}required{% endif %}>
  </div>
  {% for error in field.errors %}<p class="help is-danger">{{ error }}</p>{% endfor %}
  {% if field.help_text %}<p class="help">{{ field.help_text }}</p>{% endif %}
</div>
